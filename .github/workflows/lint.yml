name: Linting & Code Quality

on:
  push:
    branches: [ main, develop, 'feature/*', 'fix/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff flake8 black isort mypy

    - name: Run Ruff
      run: |
        ruff check . --exit-zero

    - name: Run Black (check only)
      run: |
        black --check . --extend-exclude="/(\.git|\.venv|venv|node_modules|\.next)/" || true

    - name: Run isort (check only)
      run: |
        isort . --check-only --skip .venv --skip venv --skip node_modules --skip .next || true

    - name: Run Flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,node_modules,.next

  lint-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint || true

    - name: Check TypeScript
      working-directory: ./frontend
      run: npx tsc --noEmit || true

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install safety
      run: |
        pip install safety

    - name: Run safety check
      run: |
        safety check --json || true

    - name: Security summary
      run: |
        echo "### Security Scan Complete :shield:" >> $GITHUB_STEP_SUMMARY
        echo "Check logs for vulnerabilities" >> $GITHUB_STEP_SUMMARY
