name: Tests & Coverage

on:
  push:
    branches: [ main, develop, 'feature/*', 'fix/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: proprexis_user
          POSTGRES_PASSWORD: proprexis_password
          POSTGRES_DB: proprexis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgresql://proprexis_user:proprexis_password@localhost:5432/proprexis_test" >> $GITHUB_ENV
        echo "TEST_MODE=true" >> $GITHUB_ENV
        echo "GROQ_API_KEY=test_key" >> $GITHUB_ENV
        echo "PAPPERS_API_KEY=test_key" >> $GITHUB_ENV
        echo "TELEGRAM_BOT_TOKEN=test_token" >> $GITHUB_ENV
        echo "TELEGRAM_CHAT_ID=123456789" >> $GITHUB_ENV
        echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U proprexis_user; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Run database migrations
      run: |
        python -c "
        from app.database import engine, Base
        from app.models import *
        Base.metadata.create_all(bind=engine)
        print('Database initialized successfully')
        "

    - name: Run tests with coverage
      run: |
        pytest --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage report as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage.xml

    - name: Test summary
      if: always()
      run: |
        echo "### Test Results :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Coverage threshold: 80%" >> $GITHUB_STEP_SUMMARY
        echo "See full report in artifacts" >> $GITHUB_STEP_SUMMARY
